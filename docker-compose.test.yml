version: '3.8'

# Test-environment mirror of docker-compose.yml (production).
# - Always run it isolated:
#     podman-compose -p smca-test -f docker-compose.test.yml <cmd>
# - Its environment variables come from the `.env` at the root of this checkout
#   (same mechanism as production: the `.env` lives next to this file).
# - Production and test share nothing: separate project, network, volumes,
#   container names and host ports. Never launch this file against the
#   production project, and never reuse the production backend image tag.

services:
  frontend:
    container_name: smca_test_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    restart: always

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - smca_test_network

  api:
    container_name: smca_test_backend
    image: localhost/store-mgmt_backend_test:latest
    # build:
    #   context: ./backend/src
    #   dockerfile: Dockerfile
    #   args:
    #     - configuration=Release
    environment:
      # Single underscore: ASPNETCORE__ENVIRONMENT is not a name the host recognises,
      # so the environment silently fell back to Production regardless of ${ENVIRONMENT}.
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      # Double underscore maps to the ':' of a configuration key, and environment
      # variables outrank every appsettings file. These keys are the ones the app
      # actually reads; the previous AppSettings__* names matched nothing, so the
      # database password and the signing key below were being discarded in silence.
      #
      # Persist Security Info is left off (defaults to false) so the password is not
      # readable from the connection object once connected, and error detail is off so
      # parameter values do not reach exception messages and logs.
      - ConnectionStrings__Application=Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false
      - Jwt__SecretKey=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Authentication__Pepper=${AUTH_PEPPER}
      - StoreEncryption__MasterSecret=${STORE_ENCRYPTION_MASTER_SECRET}
      # Read by nothing in SMCA.WebApi — kept as-is pending a decision on whether the
      # password-reset and SMTP features get wired up or dropped.
      - AppSettings__PasswordResetUrl=${PASSWORD_RESET_URL}
      - SmtpSettings__SmtpServer=${SMTP_SERVER}
      - SmtpSettings__Port=${SMTP_PORT}
      - SmtpSettings__Username=${SMTP_USERNAME}
      - SmtpSettings__Password=${SMTP_PASSWORD}
      - SmtpSettings__FromEmail=${SMTP_FROM_EMAIL}
      - SmtpSettings__EnableSsl=${SMTP_ENABLE_SSL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 120s
    depends_on:
      - postgres
    restart: always
    networks:
      - smca_test_network

  postgres:
    image: quay.io/lib/postgres:16-alpine
    container_name: smca_test_postgres_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always

    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      # Unlike production, ./backend/scripts is NOT mounted as
      # docker-entrypoint-initdb.d here: the test database is always rebuilt
      # from the production dump, never from the init scripts.
    networks:
      - smca_test_network

  pgadmin:
    image: quay.io/dev_zone/dpage/pgadmin4
    container_name: smca_test_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always
    ports:
      - "5051:80"
    volumes:
      - /etc/localtime:/etc/localtime
      - pgadmin-test-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - smca_test_network

  nginx:
    build: loadbalancer
    container_name: smca_test_nginx
    restart: always
    ports:
      - "8093:8083"
    depends_on:
      - frontend
      - api
    networks:
      - smca_test_network

  web-store-pos:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: smca_test_web_pos
    restart: always
    ports:
      - "8095:80"
    depends_on:
      - api
    networks:
      - smca_test_network

volumes:
  postgres_test_data:
  pgadmin-test-data:

networks:
  smca_test_network:
    driver: bridge
