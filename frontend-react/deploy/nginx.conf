# Serves the web-store-pos SPA and proxies /api to the shared store-mgmt backend
# (the `api` service on the compose network, port 8000) — mirroring
# loadbalancer/nginx.conf so this React frontend talks to the same backend as vdt.
events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Static upstream resolved once at startup — mirrors the proven
  # loadbalancer/nginx.conf (the Angular stack) which talks to the same `api`
  # service on the shared compose network. Avoids the per-request `resolver`
  # dependency (127.0.0.11) that hung /api for 30s when that embedded DNS
  # wasn't reachable in this runtime.
  upstream api {
    server api:8000;
  }

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2;

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # All API calls go to the shared backend via the static `upstream api`
    # above — same pattern as loadbalancer/nginx.conf.
    location /api {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — client-side routing owns everything else.
    location / {
      try_files $uri /index.html;
    }
  }
}
