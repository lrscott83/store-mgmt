# Serves the web-store-pos SPA and proxies /api to the shared store-mgmt backend
# (the `api` service on the compose network, port 8000) — mirroring
# loadbalancer/nginx.conf so this React frontend talks to the same backend as vdt.
events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Static upstream resolved once at startup — mirrors the proven
  # loadbalancer/nginx.conf (the Angular stack) which talks to the same `api`
  # service on the shared compose network. Avoids the per-request `resolver`
  # dependency (127.0.0.11) that hung /api for 30s when that embedded DNS
  # wasn't reachable in this runtime.
  upstream api {
    server api:8000;
  }

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2;

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Report-only CSP (content-security-policy spec). Server level, not inside
    # `location /` — nginx does NOT merge `add_header` into a child block that
    # declares its own, it replaces it, so a header added later inside a
    # location block would silently shadow this one. Server level reaches
    # both `location /api` and `location /` below (design.md D6). `always` so
    # the header still ships on non-2xx/3xx responses. This value is a
    # VERIFIED COPY of `apps/web-store-pos/scripts/csp-policy.mjs`'s
    # `buildCspHeaderValue('prod')` (with `hydrationScriptHashes` from the
    # current build) — `apps/web-store-pos/scripts/verify-csp.mjs` fails the
    # build if the two ever drift (design.md D7).
    #
    # The three 'sha256-...' script-src sources allowlist react-router's
    # static SPA-mode hydration payload — three inline scripts
    # `build/client/index.html` always carries (window.__reactRouterContext
    # assignment + two streamController calls), confirmed present in a real
    # production build 2026-08-12 (previously assumed dev-only). A future
    # react-router upgrade that reformats this payload changes its hash;
    # `verify-csp.mjs` recomputes the hash from THAT build and fails loudly
    # here rather than silently — regenerate via
    # `pnpm build` + read the failing check's "generated production policy"
    # value, the same way `checkConnectSrcCoverage` drift is resolved today.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'report-sample' 'sha256-RBZNiG3Ztb26Xi/69+VRecU4BPhrfxcvspLXMRrrCNE=' 'sha256-duhaxWNI+6QAukUMmlYrkl97X+e0pxobkwS+TpY5/CQ=' 'sha256-rdlXTHfEAEs7sKWexTJXi4APml6Ay8nKaanL+KiM1LI='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'" always;

    # All API calls go to the shared backend via the static `upstream api`
    # above — same pattern as loadbalancer/nginx.conf.
    location /api {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache policy (deploy-cache fix). Uses the `expires` directive, NOT
    # `add_header`: a child block declaring its own `add_header` REPLACES the
    # server-level CSP header above (nginx does not merge — see the CSP
    # comment), so any `add_header Cache-Control ...` here would silently drop
    # the CSP. `expires` is a separate directive and leaves add_header
    # inheritance intact.
    #
    # /index.html and /service-worker.js MUST be revalidated on every load: a
    # stale cached shell or worker is exactly what makes a new deploy invisible.
    location = /index.html {
      expires -1;
    }
    location = /service-worker.js {
      expires -1;
    }
    # Vite emits content-hashed filenames here — safe to cache forever.
    location /assets/ {
      expires 1y;
      access_log off;
    }

    # SPA fallback — client-side routing owns everything else. The internal
    # rewrite to /index.html lands on the exact-match location above, so the
    # shell keeps its no-cache policy.
    location / {
      try_files $uri /index.html;
    }
  }
}
