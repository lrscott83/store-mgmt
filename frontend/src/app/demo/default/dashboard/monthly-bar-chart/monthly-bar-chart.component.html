<div class="d-flex align-items-center justify-content-between mb-3">
  <h5 class="mb-0">Unique Visitor</h5>
  <div class="d-flex gap-2 chart-income">
    <div class="chart-income month" (click)="toggleActive('month')">Month</div>
    <div class="chart-income week" (click)="toggleActive('week')">Week</div>
  </div>
</div>
<div class="card">
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-sm">
        <thead>
          <tr>
            <th>Category</th>
            <th>Page Views</th>
            <th>Sessions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cat of categories; let i = index">
            <td>{{ cat }}</td>
            <td>{{ pageViewsData[i] || 0 }}</td>
            <td>{{ sessionsData[i] || 0 }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
