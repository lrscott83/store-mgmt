<div class="card mt-4">
  <div class="row mt-3">
    <div class="col-12">
      <h5 class="mb-3">Ganancias - Últimos 30 Días</h5>
      <p class="text-muted">Total: {{ total | number: '1.2-2' }} | Promedio: {{ promedio | number: '1.2-2' }}</p>
      <div class="table-responsive">
        <table class="table table-sm table-striped">
          <thead>
            <tr>
              <th>Día</th>
              <th>Ganancias</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let label of labels; let i = index">
              <td>{{ label }}</td>
              <td>{{ data[i] | number: '1.2-2' }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
