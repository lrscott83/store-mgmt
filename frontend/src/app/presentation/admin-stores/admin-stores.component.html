<div class="row">
    <div class="card card-custom gutter-b">
        <div class="card-header">
            <div class="card-title">
                <h3 class="card-label">{{ 'MENU.ADMIN.STORES' | translate }}</h3>
            </div>
            <div class="card-toolbar">
                <button mat-fab extended color="primary" (click)="openCreateStoreModal()">
                    <mat-icon>add</mat-icon>
                    {{'GENERAL.ADD' | translate}}
                </button>
            </div>
        </div>
        <div class="card-body">
            <app-grid-stores [stores]="stores$ | async"></app-grid-stores>
        </div>
    </div>
</div>
