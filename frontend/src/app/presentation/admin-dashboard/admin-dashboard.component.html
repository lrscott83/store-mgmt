<div class="card card-custom gutter-b">
  <div class="card-header">
    <div class="card-title">
      <h3 class="card-label" [translate]="'DASHBOARD.HEADER'"></h3>
    </div>
  </div>
  <div class="card-body p-2">
    <div class="container">
      <h1>Estadísticas de Tiendas Activos</h1>

      <!-- Botones de selección -->
      <div class="button-group">
        <button [class.active]="viewType === '7days'" (click)="changeView('7days')" class="btn"> Últimos 7 días </button>
        <button [class.active]="viewType === '30days'" (click)="changeView('30days')" class="btn"> Últimos 30 días </button>
      </div>

      <!-- Datos tabulares -->
      <div class="table-responsive mt-3">
        <table class="table table-sm table-striped">
          <thead>
            <tr>
              <th>Categoría</th>
              <th>Valor</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let cat of categories; let i = index">
              <td>{{ cat }}</td>
              <td>{{ data[i] || 0 }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
