<div class="card card-custom gutter-b">
  <div class="card-header">
    <div class="card-title">
      <h3 class="card-label" [translate]="'DASHBOARD.HEADER'"></h3>
    </div>
  </div>
  <div class="card-body p-2">
    <div class="container">
      <h1>Estadísticas de Tiendas Activos</h1>

      <!-- Botones de selección -->
      <div class="button-group">
        <button [class.active]="viewType === '7days'" (click)="changeView('7days')" class="btn">
          Últimos 7 días
        </button>
        <button [class.active]="viewType === '30days'" (click)="changeView('30days')" class="btn">
          Últimos 30 días
        </button>
      </div>

      <!-- Gráfico -->
      @if (!!chartOptions) {
        <div class="chart-container">
          <apx-chart [series]="chartOptions.series" [chart]="chartOptions.chart" [xaxis]="chartOptions.xaxis"
            [yaxis]="chartOptions.yaxis" [dataLabels]="chartOptions.dataLabels"
            [plotOptions]="chartOptions.plotOptions" [stroke]="chartOptions.stroke"
            [tooltip]="chartOptions.tooltip" [fill]="chartOptions.fill">
          </apx-chart>
        </div>
      }

      <!-- Estadísticas resumidas -->

</div>
