<!--begin::Item-->
<div class="table-responsive">
    <table class="table table-borderless table-vertical-center">
        <tbody>
            <tr *ngFor="let item of products$ | async" class="border-1">
                <td class="p-2">
                    <span class="text-dark mb-1 font-size-lg">
                        {{item.name}}
                    </span>
                </td>
                <td class="text-right p-2">
                    <span class="text-primary mb-1 font-size-lg">
                        {{item.price | currency:'USD':'symbol':'1.2-2'}}
                    </span>
                </td>
                <td class="text-right p-2">
                    <button (click)="addProductToCart(item.id)" mat-mini-fab color="primary" >
                        <mat-icon>shopping_cart</mat-icon>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
