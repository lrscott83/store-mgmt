<div class="row text-end mb-2">
    <div class="col text-end">
        @if (order.isActive) {
        <button mat-fab extended color="primary" (click)="deactivateOrder(order)">
            <mat-icon>edit</mat-icon>
            {{'TODAY_ORDERS.DEACTIVATE_ORDER'| translate}}
        </button>
        } @else {
        <button mat-fab extended color="primary" (click)="activateOrder(order)">
            <mat-icon>edit</mat-icon>
            {{'TODAY_ORDERS.ACTIVATE_ORDER'| translate}}
        </button>
        }
    </div>
</div>

<div class="table-responsive">
    <table class="table table-borderless table-vertical-center">
        <tbody>
            <tr *ngFor="let item of order.orderItems" class="border-1">
                <td class="p-2">
                    <span class="text-dark font-weight-bold mb-1 font-size-lg">
                        {{item.name}}
                    </span>
                </td>
                <td class="text-end p-2">
                    <span class="label label-success font-weight-bold font-size-lg">
                        {{item.quantity}}
                    </span>
                </td>
                <td class="text-end p-2">
                    <span class="text-primary font-weight-bold mb-1 font-size-lg">
                        {{(item.price * item.quantity) | currency:'USD':'symbol':'1.2-2'}}
                    </span>
                </td>
            </tr>
        </tbody>
    </table>
</div>
