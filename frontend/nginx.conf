server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain font/woff2 text/css text/xml text/javascript application/javascript application/xml+rss application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Disable HTTP/2 for problematic clients
    http2_max_field_size 16k;
    http2_max_header_size 32k;

    location ~ /\.env {
        deny all;
    }

    # Evitar cache de index.html para que siempre busque nuevas versiones
    location /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Service worker y ngsw.json no deben cachearse demasiado
    location /ngsw-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Assets estáticos pueden cachearse con hashing (hash generado por Angular)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # Handles Angular routing
        try_files $uri $uri/ /index.html;
    }

    # Optional: Static file caching
    location ~* \.(?:ico|css|js|gif|jpg|jpeg|png|svg|woff|woff2|ttf|otf|eot|ttf|ttc|map|webmanifest)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 404 /index.html;
}
