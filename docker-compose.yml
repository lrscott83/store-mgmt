version: '3.8'

services:
  frontend:
    container_name: smca_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    restart: always

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - postgres_network

  api:
    container_name: smca_backend
    image: localhost/store-mgmt_backend:latest
    # build:
    #   context: ./backend/src
    #   dockerfile: Dockerfile
    #   args:
    #     - configuration=Release
    environment:
      - ASPNETCORE__ENVIRONMENT=${ENVIRONMENT}
      - AppSettings__ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Persist Security Info=True;Include Error Detail=True
      - AppSettings__Secret=${JWT_SECRET}
      - AppSettings__Issuer=${JWT_ISSUER}
      - AppSettings__Audience=${JWT_AUDIENCE}
      - AppSettings__PasswordResetUrl=${PASSWORD_RESET_URL}
      - SmtpSettings__SmtpServer=${SMTP_SERVER}
      - SmtpSettings__Port=${SMTP_PORT}
      - SmtpSettings__Username=${SMTP_USERNAME}
      - SmtpSettings__Password=${SMTP_PASSWORD}
      - SmtpSettings__FromEmail=${SMTP_FROM_EMAIL}
      - SmtpSettings__EnableSsl=${SMTP_ENABLE_SSL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 120s
    depends_on:
      - postgres
    restart: always

    networks:
      - postgres_network
      
  postgres:
    image: quay.io/lib/postgres:16-alpine
    container_name: smca_postgres_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts:/docker-entrypoint-initdb.d
    networks:
      - postgres_network

  pgadmin:
    image: quay.io/dev_zone/dpage/pgadmin4
    container_name: smca_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always
    ports:
      - "5050:80"
    volumes:
      - /etc/localtime:/etc/localtime
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - postgres_network
  nginx:
    build: loadbalancer
    container_name: smca_nginx
    restart: always
    ports:
      - "8083:8083"
    depends_on:
      - frontend
      - api
    networks:
      - postgres_network

  web-store-pos:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: smca_web_pos
    restart: always
    ports:
      - "8085:80"
    depends_on:
      - api
    networks:
      - postgres_network
volumes:
  postgres_data:
  pgadmin-data:

networks:
  postgres_network:
    driver: bridge
