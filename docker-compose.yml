version: '3.8'

# PRODUCTION stack. The legacy Angular frontend (`frontend`) and its load
# balancer (`nginx`) were removed on purpose: Angular is dead and the React SPA
# (`web-store-pos`) is self-sufficient — it serves itself and proxies /api to
# `api:8000` with its own nginx. `frontend/` and `loadbalancer/` stay in the
# repo untouched (frozen legacy), only their services are gone.

services:
  api:
    container_name: smca_backend
    image: localhost/store-mgmt_backend:latest
    # build:
    #   context: ./backend/src
    #   dockerfile: Dockerfile
    #   args:
    #     - configuration=Release
    environment:
      # Single underscore: ASPNETCORE__ENVIRONMENT is not a name the host recognises,
      # so the environment silently fell back to Production regardless of ${ENVIRONMENT}.
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      # Double underscore maps to the ':' of a configuration key, and environment
      # variables outrank every appsettings file. These keys are the ones the app
      # actually reads; the previous AppSettings__* names matched nothing, so the
      # database password and the signing key below were being discarded in silence.
      #
      # Persist Security Info is left off (defaults to false) so the password is not
      # readable from the connection object once connected, and error detail is off so
      # parameter values do not reach exception messages and logs.
      - ConnectionStrings__Application=Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false
      - Jwt__SecretKey=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Authentication__Pepper=${AUTH_PEPPER}
      - StoreEncryption__MasterSecret=${STORE_ENCRYPTION_MASTER_SECRET}
      # Read by nothing in SMCA.WebApi — kept as-is pending a decision on whether the
      # password-reset and SMTP features get wired up or dropped.
      - AppSettings__PasswordResetUrl=${PASSWORD_RESET_URL}
      - SmtpSettings__SmtpServer=${SMTP_SERVER}
      - SmtpSettings__Port=${SMTP_PORT}
      - SmtpSettings__Username=${SMTP_USERNAME}
      - SmtpSettings__Password=${SMTP_PASSWORD}
      - SmtpSettings__FromEmail=${SMTP_FROM_EMAIL}
      - SmtpSettings__EnableSsl=${SMTP_ENABLE_SSL}
      # Página estática del catálogo público (feature public-catalog-static-pages). La API escribe
      # <OutputRoot>/catalog/<slug>/index.html en el volumen compartido y lee <ShellPath> —el shell
      # del SPA que publica web-store-pos en ese mismo volumen— para inyectarle el <head>.
      # PublicBaseUrl debe ser la URL absoluta del sitio: el canonical y las URLs de imagen tienen
      # que ser absolutas porque el HTML se sirve estático y los rastreadores no resuelven relativas.
      # Sin ShellPath ni OutputRoot la feature queda apagada (el regenerador se calla).
      - CatalogStaticPage__OutputRoot=/srv/catalog-pages
      - CatalogStaticPage__ShellPath=/srv/catalog-pages/shell/index.html
      - CatalogStaticPage__PublicBaseUrl=${PUBLIC_BASE_URL:-https://pos.playground.sceiba.net}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 120s
    volumes:
      # Imágenes del catálogo (Storage:CatalogImageRoot → /app/storage): volumen persistente.
      # El Dockerfile crea el directorio con dueño `app`; con un named volume el primer mount
      # copia ese dueño, así la API no-root puede escribir y las imágenes sobreviven a redeploys.
      - storage_data:/app/storage
      # Páginas pre-generadas del catálogo (feature public-catalog-static-pages) + el shell del SPA
      # que publica web-store-pos. Mismo camino en los dos contenedores para que OutputRoot y la
      # raíz de nginx sean el mismo directorio.
      - catalog_pages:/srv/catalog-pages
    depends_on:
      - postgres
    restart: always

    networks:
      - postgres_network
      
  postgres:
    image: quay.io/lib/postgres:16-alpine
    container_name: smca_postgres_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts:/docker-entrypoint-initdb.d
    networks:
      - postgres_network

  pgadmin:
    image: quay.io/dev_zone/dpage/pgadmin4
    container_name: smca_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always
    ports:
      - "5050:80"
    volumes:
      - /etc/localtime:/etc/localtime
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - postgres_network
  web-store-pos:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      args:
        # Canonical/og:url de la landing. Mismo valor que usa la API para los
        # catálogos (CatalogStaticPage__PublicBaseUrl), para no tener dos fuentes.
        PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://pos.playground.sceiba.net}
    container_name: smca_web_pos
    restart: always
    ports:
      - "8085:80"
    volumes:
      # El mismo volumen que la API. Aquí nginx sirve las páginas generadas (location del catálogo en
      # frontend-react/deploy/nginx.conf) y el entrypoint publica el shell + archiva los assets del
      # build para que las páginas aún no regeneradas sigan cargando (S9).
      - catalog_pages:/srv/catalog-pages
    depends_on:
      - api
    networks:
      - postgres_network
volumes:
  postgres_data:
  pgadmin-data:
  storage_data:
  catalog_pages:

networks:
  postgres_network:
    driver: bridge
